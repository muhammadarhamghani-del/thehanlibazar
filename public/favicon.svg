<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="70%" stop-color="#0c0a09"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2a1"/>
      <stop offset="35%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Dark Obsidian Medallion -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)"/>
  <circle cx="50" cy="50" r="47" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="43.5" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" stroke-dasharray="2,2"/>

  <!-- Centered Brand Crest: Imperial Eagle & Crossed Scimitars -->
  <g filter="url(#goldGlow)" fill="url(#goldGrad)">
    <!-- Crossed Swords (Scimitars) -->
    <!-- Left to Right Sword -->
    <path d="M 28 69 C 38 60 56 46 72 37 C 70 41 53 58 40 67 Z" fill="url(#bladeGrad)"/>
    <rect x="25" y="68" width="5" height="3" rx="1.5" transform="rotate(-35 27 69)" fill="#fef08a"/>
    <circle cx="23" cy="73" r="2.2" fill="#eab308"/>

    <!-- Right to Left Sword -->
    <path d="M 72 69 C 62 60 44 46 28 37 C 30 41 47 58 60 67 Z" fill="url(#bladeGrad)"/>
    <rect x="70" y="68" width="5" height="3" rx="1.5" transform="rotate(35 73 69)" fill="#fef08a"/>
    <circle cx="77" cy="73" r="2.2" fill="#eab308"/>

    <!-- Center Crest Shield / Core -->
    <circle cx="50" cy="56" r="4" fill="url(#goldGrad)"/>

    <!-- Imperial Spread-Wing Eagle -->
    <!-- Head & Crown -->
    <path d="M 50 20 L 52 24 L 54 21 L 53 26 L 47 26 L 46 21 L 48 24 Z" fill="#fff2a1"/>
    <!-- Head Profile -->
    <polygon points="50,23 53,27 47,27"/>
    <polygon points="53,25 56,26 53,27"/>

    <!-- Left Wing -->
    <path d="M 48 28 C 42 24 32 24 22 30 C 26 35 34 38 46 36 C 36 39 27 41 24 45 C 30 47 38 46 47 42 C 40 46 33 49 31 54 C 38 53 45 50 49 46 Z"/>
    
    <!-- Right Wing -->
    <path d="M 52 28 C 58 24 68 24 78 30 C 74 35 66 38 54 36 C 64 39 73 41 76 45 C 70 47 62 46 53 42 C 60 46 67 49 69 54 C 62 53 55 50 51 46 Z"/>

    <!-- Eagle Body & Tail -->
    <path d="M 47 27 C 46 35 46 45 44 55 L 50 57 L 56 55 C 54 45 54 35 53 27 Z"/>
    <polygon points="46,55 50,62 54,55"/>
  </g>
</svg>